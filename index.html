<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GRANTLY helps students find scholarships, prepare applications, see who must act next, and track funding through payment and renewal."
    />
    <meta name="theme-color" content="#FFF7EE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>GRANTLY: scholarship discovery and management</h1>
        <p>
          GRANTLY needs JavaScript. It helps students in India find scholarships, prepare applications and track
          funding:
        </p>
        <ul>
          <li>My funding plan: the next action, and the funding gap after confirmed support only.</li>
          <li>Opportunities: eligibility checked condition by condition against official sources.</li>
          <li>Readiness: required documents checked against each programme's rules.</li>
          <li>Applications: status tracks and a caseworker that turns provider notices into tasks.</li>
          <li>Funding and renewal: award, payment and renewal tracked separately.</li>
          <li>College desk: a shared task queue between students and their college.</li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
